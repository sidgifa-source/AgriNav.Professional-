<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غير متصل — AgriNav Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .icon { font-size: 5rem; margin-bottom: 20px; animation: pulse 2s infinite; }
  h1 { font-size: 1.8rem; margin-bottom: 12px; }
  p { opacity: .9; margin-bottom: 8px; line-height: 1.6; max-width: 400px; }
  button {
    margin-top: 24px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: bold;
    color: #1b5e20;
    background: #ffd700;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    font-family: inherit;
  }
  button:active { transform: scale(.96); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  .tip { font-size: .85rem; opacity: .7; margin-top: 20px; max-width: 320px; }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>الموقع الذي حاولت الوصول إليه غير متاح حالياً.</p>
  <p>بعض الأجزاء المخزَّنة قد تعمل، لكن <strong>الخرائط الجديدة</strong> تحتاج اتصالاً بالشبكة.</p>
  <button onclick="location.reload()">🔄 إعادة المحاولة</button>
  <div class="tip">
    💡 نصيحة: عند العودة للاتصال، افتح التطبيق مرة واحدة ليقوم بتحديث البلاطات المخزَّنة تلقائياً.
  </div>
</body>
</html>
